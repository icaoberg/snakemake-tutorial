# Configuration for exercise1.
#
# Each entry is one quadratic equation  a*x^2 + b*x + c = 0.
# The key (e.g. "two_real") becomes the value of the {equation} wildcard.
equations:
  two_real:      # x^2 - 3x + 2 = 0   ->  x = 2, x = 1
    a: 1
    b: -3
    c: 2
  one_real:      # x^2 - 2x + 1 = 0   ->  x = 1 (a double root)
    a: 1
    b: -2
    c: 1
  complex:       # x^2 + 2x + 5 = 0   ->  x = -1 ± 2i
    a: 1
    b: 2
    c: 5
